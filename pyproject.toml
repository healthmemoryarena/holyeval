[project]
name = "mirobody-eval"
version = "0.1.0"
description = "Evaluation for mirobody — seed a synthetic user, score your deployment, reproduce any published benchmark"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "holyeval-evaluator",
    "holyeval-benchmark",
    "holyeval-generator",
    "holyeval-web",
]

[project.optional-dependencies]
# Seeding a deployment and the `mirobody` target both reach into the engine they
# are pointed at — `execute_query` for its Postgres, `IndicatorSyncTask` to make
# the seeded indicators searchable, `JWT_KEY` to sign a token for a synthetic
# user that has no login. Optional because every other target here speaks plain
# HTTP and needs none of it.
#
# Both halves of this requirement were found the hard way, by installing it and
# importing what the seeder actually calls:
#
#   `[server]` — `mirobody.task.base` does a plain `from redis.asyncio import
#   Redis`, and redis (with psycopg and sqlalchemy, which `execute_query` needs)
#   lives in that extra. Bare `mirobody` installs, and then `IndicatorSyncTask`
#   dies on `No module named 'redis'`.
#
#   `>=1.2.1`  — `mirobody.task` and `mirobody.indicator.fhir` first appear in
#   the 1.0.62 wheel (1.0.51 has neither), and the `server` extra itself first
#   appears in 1.2.1 — 1.0.62 declares only cn/fin/test.
#
# The marker is required rather than cosmetic: mirobody is Python>=3.12 while
# this project supports >=3.11, so an unmarked requirement makes the whole
# workspace unresolvable on 3.11 — including for the targets that never touch
# mirobody. On 3.11 the extra therefore installs nothing, and
# `generator.eslbench.seed_mirobody` says so instead of failing on an import.
mirobody = ["mirobody[server]>=1.2.1; python_version >= '3.12'"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["evaluator", "benchmark", "generator", "web"]

[tool.uv.sources]
holyeval-evaluator = { workspace = true }
holyeval-benchmark = { workspace = true }
holyeval-generator = { workspace = true }
holyeval-web = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "python-dotenv>=1.2.1",
    "httpx>=0.25",
]
lint = [
    "ruff>=0.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "api: 需要真实 API Key 的集成测试（deselect: -m 'not api'）",
]
filterwarnings = [
    # Pydantic 模型名以 Test 开头导致的误收集
    "ignore::pytest.PytestCollectionWarning",
    # langchain + Python 3.14 兼容性
    "ignore:.*Pydantic V1.*:UserWarning",
    # asyncio.iscoroutinefunction Python 3.16 弃用
    "ignore:.*iscoroutinefunction.*:DeprecationWarning",
    # google genai Python 3.17 弃用
    "ignore:.*_UnionGenericAlias.*:DeprecationWarning",
    # aiohttp 继承弃用
    "ignore:.*Inheritance class.*:DeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py311"
